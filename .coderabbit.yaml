# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be direct and specific. Focus on correctness over style. Skip generic encouragement."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: false
  changed_files_summary: true

  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!tests/.tmp/**"
    - "!tests/sandbox/**"
    - "!.claude/worktrees/**"

  path_instructions:
    - path: "plugins/*/skills/*/SKILL.md"
      instructions: |
        - Front-matter must include both `name:` and `description:` fields — a PostToolUse hook warns when either is missing (warning only, not blocking), and they are required for Claude to correctly route skill invocations.
        - Any reference to fpkit source must use a full GitHub URL pinned to a tag or commit SHA. Never `blob/main` — e.g. `https://github.com/shawn-sandy/acss/blob/<tag-or-sha>/...`.
        - Skills should delegate display logic to slash commands, not duplicate it inline.

    - path: "plugins/*/commands/*.md"
      instructions: |
        - Front-matter must include a `description:` field. Optional fields are `argument-hint:` and `allowed-tools:`. There is no `name:` field in command front-matter.
        - The command body should delegate to the corresponding SKILL.md rather than duplicating logic inline.

    - path: "plugins/*/.claude-plugin/plugin.json"
      instructions: |
        - Required fields: `name`, `version`, `description`. Flag any missing fields.
        - `version` must follow semver (MAJOR.MINOR.PATCH). This is the authoritative version source — Claude Code and `/plugin update` read it directly.
        - Do NOT add a `version` key to `marketplace.json` — only `plugin.json` carries the version.

    - path: ".claude-plugin/marketplace.json"
      instructions: |
        - Plugin entries must NOT contain a `version` field — the per-plugin `plugin.json` always wins.
        - `description` should accurately reflect all commands and capabilities shipped in the current plugin version.

    - path: "plugins/*/scripts/**/*.py"
      instructions: |
        - Python 3 stdlib only — do not introduce new third-party dependencies. The one existing exception is `tinycss2` in `plugins/acss-kit/scripts/validate_utilities.py`; flag any other third-party imports.
        - Detector contract: JSON object to stdout, `reasons` array always present, exit 0 (pass), 1 (fail), or 2 (usage/IO error).
        - Generator/validator contract: data to stdout, errors to stderr, exit 0/1/2.
        - Scripts must be self-contained and runnable standalone with no extra setup.

    - path: "**/*.scss"
      instructions: |
        - Every `var(--color-*)`, `var(--font-*)`, and `var(--space-*)` reference must include a fallback, e.g. `var(--color-primary, #000)`.
        - Use `[aria-disabled="true"]` for disabled state — not `:disabled`.
        - Follow the OKLCH naming conventions used by the project's theme system.

    - path: "plugins/*/skills/*/references/**"
      instructions: |
        - All fpkit cross-references must use full GitHub URLs pinned to a tag or commit SHA — never `blob/main`.
        - Component reference docs must include `## Props Interface` and `## TSX Template` sections; these are what the test harness extracts and what `/kit-add` emits.
        - Verify new component docs are listed in the `references/components/catalog.md` verification table.

    - path: "plugins/*/CHANGELOG.md"
      instructions: |
        - Must follow Keep-a-Changelog format with an `[Unreleased]` section at the top.
        - Each versioned entry needs a date in `YYYY-MM-DD` format.
        - Entries should map to actual code changes in the PR — flag entries that describe features not present in the diff.

    - path: "tests/**"
      instructions: |
        - `tests/run.sh` wipes `tests/.tmp/` at the start of every run — don't write outputs there that need to persist.
        - Fixtures under `tests/fixtures/known-bad/` must continue to fail validation; if a known-bad fixture starts passing, a validator has regressed.
        - Node scripts use `.mjs` extension — do not mix `.js` and `.mjs` in the test harness.
        - `tests/run.sh` and `tests/e2e.sh` are the only two entry points; call those, not the internal helpers directly.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "wip"
      - "draft"
      - "DO NOT MERGE"
    drafts: false
    base_branches:
      - "main"

